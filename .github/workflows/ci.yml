name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get dependencies
        run: go mod download

      - name: Build binary
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubespectre-linux-amd64
          path: bin/kubespectre

  # WO-17: Verify the Windows artifact family that GoReleaser publishes.
  build-windows:
    name: Build (Windows ${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          New-Item -ItemType Directory -Force bin
          go build -o bin/kubespectre.exe ./cmd/kubespectre

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubespectre-windows-${{ matrix.goarch }}
          path: bin/kubespectre.exe

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m
